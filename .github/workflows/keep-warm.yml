name: keep-warm

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the free Render instance
        run: |
          curl -fsS --max-time 30 https://clinic-booking-api-1rjj.onrender.com/health || true
